services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6380:6379"   # Redis protocol (clients); 6380 to avoid clashing with a local Redis
      - "3000:3000"   # FalkorDB Browser
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    restart: unless-stopped

volumes:
  falkordb-data:
